version: '3'
services:
  agregarr:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 7173:7171
    volumes:
      - ./config:/app/config
      # Mount your media folders (read-only).
      # Then configure the path mappings in Settings > Media Folders.
      # Format: /host/path:/container/path:ro
      # - /your/movies/folder:/media/movies:ro
      # - /your/series/folder:/media/series:ro
    restart: unless-stopped
